<!-- HMI Dock Templates | ISA-101 -->

<!-- NORTH: Header Bar -->
<template id="tpl-dock-north">
  <div class="dock dock-north">
    <div class="hmi-logo">
      <span>🌳</span>
      <span>YGGDRASIL</span>
    </div>
    <div class="hmi-title" id="screen-title">Overview</div>
    <div class="hmi-clock" id="clock">--:--:--</div>
  </div>
</template>

<!-- WEST: Navigation Tree -->
<template id="tpl-dock-west">
  <div class="dock dock-west">
    <nav class="nav-tree">
      <a href="./" class="nav-item active">
        <span class="level">L1</span> Overview
      </a>
      <a href="./core/" class="nav-item">
        <span class="level">L2</span> Core
      </a>
      <a href="./simulation/" class="nav-item">
        <span class="level">L2</span> Simulation
      </a>
      <a href="./standards/" class="nav-item">
        <span class="level">L3</span> Standards
      </a>
      <a href="./lessons/" class="nav-item">
        <span class="level">L3</span> Academy
      </a>
      <a href="./ai/" class="nav-item">
        <span class="level">L4</span> Kono AI
      </a>
    </nav>
  </div>
</template>

<!-- EAST: Status Panel -->
<template id="tpl-dock-east">
  <div class="dock dock-east">
    <div class="status-panel">
      <div class="status-card">
        <h3>System κ</h3>
        <div class="kpi-value" id="kappa-display">0.618</div>
        <div class="kpi-label">Target: 0.618</div>
        <div class="bar-graph" style="margin-top:8px">
          <div class="bar-fill" id="kappa-bar" style="width:61.8%"></div>
          <div class="bar-target" style="left:61.8%"></div>
        </div>
      </div>
      <div class="status-card">
        <h3>Status</h3>
        <div class="indicator">
          <span class="led running" id="led-status"></span>
          <span id="status-text">Optimal</span>
        </div>
      </div>
      <div class="status-card">
        <h3>Trees Active</h3>
        <div class="kpi-value" id="tree-count">5</div>
      </div>
      <div class="status-card">
        <h3>Season</h3>
        <div class="kpi-value" id="season">0</div>
      </div>
    </div>
  </div>
</template>

<!-- SOUTH: Alarm Banner -->
<template id="tpl-dock-south">
  <div class="dock dock-south">
    <div class="alarm-banner">
      <span class="alarm-count zero" id="alarm-count">0</span>
      <span>Active Alarms</span>
    </div>
    <div>κ=0.618 | © 2024 Konomi Systems</div>
    <div>ISA-101 Compliant</div>
  </div>
</template>

<!-- CENTER: Content Area -->
<template id="tpl-dock-center">
  <div class="dock dock-center">
    <div class="hmi-content" id="content">
      <!-- Screen content injected here -->
    </div>
  </div>
</template>
